name: QA CI/CD

on:
  push:
    branches: [ "qa", "release/*" ]
  pull_request:
    branches: [ "qa" ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Set up Node for Angular
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-angular/package-lock.json

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend-angular

    - name: Test frontend
      run: npm test -- --watch=false --browsers=ChromeHeadless
      working-directory: frontend-angular

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Run Integration Tests (QA)
      run: ./gradlew test bootJar
      # Optionally: Add SonarQube or other security scan steps here for QA
