name: PROD CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Production Package (Skip tests for speed if desired, or run them)
      run: ./gradlew build
      
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: new-cotizador-app
        path: build/libs/*.jar
        retention-days: 7
