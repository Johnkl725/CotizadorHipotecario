name: PROD CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Set up Node for Angular
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend-angular/package-lock.json

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend-angular

    - name: Test frontend
      run: npm test -- --watch=false --browsers=ChromeHeadless
      working-directory: frontend-angular

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Production Package (Skip tests for speed if desired, or run them)
      run: ./gradlew build
      
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: new-cotizador-app
        path: build/libs/*.jar
        retention-days: 7
