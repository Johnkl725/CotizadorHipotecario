name: DEV CI/CD

on:
  push:
    branches: [ "develop", "dev" ]
  pull_request:
    branches: [ "develop", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle and Run Unit Tests
      run: ./gradlew build
