# Paso 1: parametros preparados para el futuro starter Data JPA.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:14330;databaseName=Cotizador;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Hibernate detectara el dialecto de SQL Server mediante JDBC.
