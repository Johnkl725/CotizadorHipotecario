spring.application.name=NewCotizador
server.port=${PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=1000
server.tomcat.connection-timeout=10s
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:14330;databaseName=Cotizador;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:cotizador_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.data-source-properties.loginTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=15000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.jakarta.persistence.query.timeout=5000
spring.transaction.default-timeout=10s
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
cotizador.politica.tea-base=${TEA_BASE:9.00}
cotizador.politica.cuota-inicial-minima-porcentaje=${INICIAL_MINIMA:10.00}
cotizador.politica.score-minimo=${SCORE_MINIMO:700}
cotizador.politica.dsti-maximo=${DSTI_MAXIMO:40.00}
cotizador.politica.plazo-maximo-meses=${PLAZO_MAXIMO:360}
